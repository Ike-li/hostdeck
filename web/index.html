<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>hostdeck</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <a class="brand" href="#/">hostdeck</a>
      <button type="button" id="menu" class="menu" aria-controls="side-menu" aria-expanded="false" data-i18n="nav.menu"></button>
    </div>
    <div class="side-menu" id="side-menu">
      <a class="nav-item" id="nav-overview" href="#/"><span class="icon nav-slot" aria-hidden="true"></span><span class="nav-name"></span></a>
      <nav id="nav" data-i18n-label="nav.label"></nav>
      <a class="nav-item" id="nav-catalog" href="#/.plugins"><span class="icon nav-slot" aria-hidden="true"></span><span class="nav-name"></span></a>
      <div class="lang" role="group" data-i18n-label="lang.label">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="zh-CN" lang="zh-CN">简体中文</button>
      </div>
    </div>
  </aside>
  <div id="nav-backdrop" class="nav-backdrop" hidden></div>
  <main>
    <p id="banner" class="banner" role="alert" hidden></p>
    <p id="layout-note" class="note" role="status" hidden><span data-i18n="layout.saved"></span> <button type="button" id="layout-undo" class="btn" data-i18n="layout.undo"></button></p>
    <section id="overview" class="overview">
      <div class="overview-head">
        <h1 data-i18n="overview.title"></h1>
        <div class="overview-actions">
          <button type="button" id="layout-reset" class="btn" data-i18n="layout.reset"></button>
          <button type="button" id="refresh" class="btn primary" data-i18n="overview.refresh"></button>
        </div>
      </div>
      <p id="empty" class="empty" hidden></p>
      <a id="empty-add" class="btn primary" href="#/.plugins" hidden data-i18n="overview.add"></a>
      <p id="overview-loading" class="empty" role="status" data-i18n="loading" hidden></p>
      <div id="cards" class="cards" aria-busy="false"></div>
    </section>
    <section id="catalog" class="overview" hidden>
      <div class="overview-head"><h1 data-i18n="catalog.title"></h1><button type="button" class="btn primary" id="catalog-add-open" data-i18n="catalog.page"></button></div>
      <p id="catalog-intro" class="empty"></p>
      <label id="catalog-search-wrap" class="search-field" hidden><span data-i18n="catalog.search"></span><input id="catalog-search" class="catalog-search" type="search" hidden data-i18n-placeholder="catalog.search"></label>
      <p id="catalog-no-results" class="empty" hidden data-i18n="catalog.noResults"></p>
      <h2 class="catalog-heading" data-i18n="catalog.installed"></h2>
      <div id="catalog-installed"></div>
      <section id="catalog-trash" hidden>
        <h2 class="catalog-heading" data-i18n="catalog.trashed"></h2>
        <div id="catalog-trash-list" class="cards"></div>
      </section>
      <section id="catalog-add">
        <h2 class="catalog-heading" data-i18n="catalog.page"></h2>
        <p id="catalog-note" class="catalog-note" hidden></p>
        <form id="page-form" class="page-form">
          <label class="edit-field"><span data-i18n="page.mode"></span><select id="page-kind" aria-describedby="page-hint">
            <option value="proxy" data-i18n="page.embed"></option>
            <option value="link" data-i18n="page.link"></option>
          </select></label>
          <label class="edit-field"><span data-i18n="page.address"></span><input id="page-address" type="text" inputmode="url" autocomplete="off" spellcheck="false" required data-i18n-placeholder="catalog.page.address"></label>
          <label class="edit-field"><span data-i18n="catalog.page.name"></span><input id="page-name" type="text" autocomplete="off" data-i18n-placeholder="catalog.page.name"></label>
          <button class="btn" type="submit" data-i18n="catalog.add"></button>
        </form>
        <p id="page-hint" class="page-hint"></p>
        <p class="page-hint" data-i18n="catalog.page.drop"></p>
        <h2 id="catalog-available-heading" class="catalog-heading" data-i18n="catalog.available"></h2>
        <div id="catalog-available" class="cards"></div>
      </section>
    </section>
    <section id="service" class="service" hidden>
      <header class="service-bar">
        <span class="service-title">
          <span id="service-icon" class="icon"></span>
          <span id="service-name" role="heading" aria-level="1"></span>
          <span id="service-dot" class="dot"></span>
        </span>
        <div class="service-actions"><button id="service-reload" class="btn" type="button" data-i18n="service.reload"></button>
        <a id="service-open" class="btn" target="_blank" rel="noopener" data-i18n="service.open"></a>
        <div id="service-more"><button id="service-clear" class="btn" type="button"></button></div></div>
      </header>
      <p id="clear-note" class="note" hidden></p>
      <p id="service-error" class="banner" role="alert" hidden></p>
      <div id="frames" class="frames"></div>
    </section>
  </main>
</div>
</body>
</html>
