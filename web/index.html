<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>hostdeck</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
<div class="app">
  <aside class="sidebar" data-i18n-label="a11y.sidebar">
    <div class="side-head">
      <a class="brand" href="#/" draggable="false"><span class="icon brand-mark" aria-hidden="true">h</span><span>hostdeck</span></a>
      <button type="button" id="menu" class="menu" aria-controls="side-menu" aria-expanded="false" data-i18n="nav.menu"></button>
    </div>
    <nav class="side-menu" id="side-menu" data-i18n-label="nav.label">
      <a class="nav-item" id="nav-overview" href="#/"><span class="icon nav-slot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="nav-name"></span></a>
      <div id="nav" role="group" data-i18n-label="nav.plugins"></div>
      <p id="nav-empty" class="empty" hidden data-i18n="nav.empty"></p>
      <div class="side-footer">
        <a class="nav-item" id="nav-catalog" href="#/.plugins"><span class="icon nav-slot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4m6-4v4M7 7h10v5a5 5 0 0 1-10 0V7zM12 17v4"/></svg></span><span class="nav-name"></span></a>
        <div class="lang" role="group" data-i18n-label="lang.label">
          <button type="button" data-lang="en" lang="en">English</button>
          <button type="button" data-lang="zh-CN" lang="zh-CN">简体中文</button>
        </div>
      </div>
    </nav>
  </aside>
  <div id="nav-backdrop" class="nav-backdrop" hidden></div>
  <main id="main" tabindex="-1">
    <p id="banner" class="banner" role="alert" hidden></p>
    <p id="layout-note" class="note" role="status" hidden><span data-i18n="layout.saved"></span> <button type="button" id="layout-undo" class="btn" data-i18n="layout.undo"></button></p>
    <section id="overview" class="overview" aria-labelledby="overview-title">
      <div class="overview-head">
        <h1 id="overview-title" data-i18n="overview.title"></h1>
        <div class="overview-actions">
          <button type="button" id="layout-reset" class="btn" data-i18n="layout.reset" hidden></button>
          <button type="button" id="refresh" class="btn primary" data-i18n="overview.refresh"></button>
        </div>
      </div>
      <p id="empty" class="empty" hidden></p>
      <p id="overview-loading" class="empty" role="status" data-i18n="loading" hidden></p>
      <div id="cards" class="cards" aria-busy="false">
        <a id="empty-add" class="add-card" href="#/.plugins" draggable="false" data-i18n-label="overview.add">
          <span class="add-card-symbol" aria-hidden="true">+</span>
          <strong data-i18n="overview.add"></strong>
          <span class="add-card-hint" data-i18n="overview.addHint"></span>
        </a>
      </div>
    </section>
    <section id="catalog" class="overview" aria-labelledby="catalog-title" hidden>
      <div class="overview-head"><h1 id="catalog-title" data-i18n="catalog.title"></h1><button type="button" class="btn primary" id="catalog-add-open" data-i18n="catalog.addContent"></button></div>
      <p id="catalog-intro" class="empty"></p>
      <label id="catalog-search-wrap" class="search-field" hidden><span data-i18n="catalog.search"></span><input id="catalog-search" class="catalog-search" type="search" hidden data-i18n-placeholder="catalog.search"></label>
      <p id="catalog-no-results" class="empty" role="status" hidden data-i18n="catalog.noResults"></p>
      <div id="catalog-installed"></div>
      <section id="catalog-trash" hidden>
        <h2 class="catalog-heading" data-i18n="catalog.trashed"></h2>
        <div id="catalog-trash-list" class="cards"></div>
      </section>
      <section id="catalog-add">
        <h2 class="catalog-heading" data-i18n="catalog.addContent"></h2>
        <p class="catalog-guidance" data-i18n="catalog.addContentHint"></p>
        <details id="connection-help" class="connection-help">
          <summary data-i18n="help.title"></summary>
          <p data-i18n="help.intro"></p>
          <section id="help-pages" aria-labelledby="help-pages-title">
            <h3 id="help-pages-title" data-i18n="help.pages.title"></h3>
            <ol>
              <li data-i18n="help.pages.step1"></li>
              <li data-i18n="help.pages.step2"></li>
              <li data-i18n="help.pages.step3"></li>
            </ol>
          </section>
          <section id="help-plugins" aria-labelledby="help-plugins-title">
            <h3 id="help-plugins-title" data-i18n="help.plugins.title"></h3>
            <ol>
              <li data-i18n="help.plugins.step1"></li>
              <li><span data-i18n="help.plugins.step2"></span><code id="help-plugin-dir"></code><pre id="help-plugin-example" tabindex="0" data-i18n-label="help.example"></pre></li>
              <li data-i18n="help.plugins.step3"></li>
            </ol>
            <p data-i18n="help.plugins.trust"></p>
          </section>
          <section class="agent-help" aria-labelledby="help-agent-title">
            <h3 id="help-agent-title" data-i18n="help.agent.title"></h3>
            <p data-i18n="help.agent.intro"></p>
            <div class="agent-prompt">
              <button type="button" class="btn" id="copy-page-prompt" data-i18n="help.agent.copyPage"></button>
              <p id="copy-page-note" class="note" role="status" hidden></p>
              <details id="page-prompt-preview"><summary data-i18n="help.agent.previewPage"></summary><label for="page-agent-prompt" data-i18n="help.agent.pageLabel"></label><textarea id="page-agent-prompt" rows="10" readonly spellcheck="false"></textarea></details>
            </div>
            <div class="agent-prompt">
              <button type="button" class="btn" id="copy-plugin-prompt" data-i18n="help.agent.copyPlugin"></button>
              <p id="copy-plugin-note" class="note" role="status" hidden></p>
              <details id="plugin-prompt-preview"><summary data-i18n="help.agent.previewPlugin"></summary><label for="plugin-agent-prompt" data-i18n="help.agent.pluginLabel"></label><textarea id="plugin-agent-prompt" rows="10" readonly spellcheck="false"></textarea></details>
            </div>
          </section>
        </details>
        <h3 class="catalog-subheading" data-i18n="catalog.page"></h3>
        <p id="catalog-note" class="catalog-note" role="status" hidden></p>
        <form id="page-form" class="page-form">
          <label class="edit-field"><span data-i18n="page.mode"></span><select id="page-kind" aria-describedby="page-hint">
            <option value="proxy" data-i18n="page.embed"></option>
            <option value="link" data-i18n="page.link"></option>
          </select></label>
          <label class="edit-field"><span data-i18n="page.address"></span><input id="page-address" type="text" inputmode="url" autocomplete="off" spellcheck="false" required data-i18n-placeholder="catalog.page.address"></label>
          <label class="edit-field"><span data-i18n="catalog.page.name"></span><input id="page-name" type="text" autocomplete="off" data-i18n-placeholder="catalog.page.name"></label>
          <button class="btn" type="submit" data-i18n="catalog.add"></button>
        </form>
        <p id="page-hint" class="page-hint"></p>
        <p class="page-hint" data-i18n="catalog.page.drop"></p>
        <h3 id="catalog-available-heading" class="catalog-subheading" data-i18n="catalog.available"></h3>
        <div id="catalog-available" class="catalog-list"></div>
      </section>
      <details class="catalog-directory"><summary data-i18n="catalog.directory"></summary><p id="catalog-directory"></p></details>
    </section>
    <section id="service" class="service" aria-labelledby="service-name" hidden>
      <header class="service-bar">
        <span class="service-title">
          <span id="service-icon" class="icon"></span>
          <h1 id="service-name"></h1>
          <span id="service-dot" class="dot"></span>
        </span>
        <div class="service-actions"><button id="service-reload" class="btn" type="button" data-i18n="service.reload"></button>
        <a id="service-open" class="btn" target="_blank" rel="noopener" data-i18n="service.open"></a>
        <div id="service-more"><button id="service-clear" class="btn" type="button"></button></div></div>
      </header>
      <p id="clear-note" class="note" hidden></p>
      <p id="service-error" class="banner" role="alert" hidden></p>
      <div id="frames" class="frames"></div>
    </section>
  </main>
</div>
<p id="live-region" class="sr-only" role="status"></p>
<dialog id="page-editor" class="page-editor" aria-labelledby="editor-title" aria-describedby="editor-description" tabindex="-1"></dialog>
</body>
</html>
