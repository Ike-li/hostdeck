name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Browser tests fail here instead of skipping when no browser is found.
      HOSTDECK_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: TEMPORARY time the PowerShell example
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File examples/disk/card.ps1
            "run $i took $($sw.Elapsed.TotalSeconds) s, exit $LASTEXITCODE"
            $out
          }
      - run: go test ./...
      - name: browser tests in Edge
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export HOSTDECK_BROWSER='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          else
            export HOSTDECK_BROWSER='/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge'
          fi
          go test -count=1 ./e2e/
