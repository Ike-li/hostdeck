name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Browser tests fail here instead of skipping when no browser is found.
      HOSTDECK_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: core race checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/core
          go test -race -short -count=1 -json -timeout=8m . ./internal/... ./web | tee test-results/core/tests.jsonl
      - name: all tests in Chrome
        shell: bash
        env:
          HOSTDECK_ARTIFACT_DIR: ${{ github.workspace }}/test-results/chrome
        run: |
          set -euo pipefail
          mkdir -p test-results/chrome
          if [ "$RUNNER_OS" = Windows ]; then
            export HOSTDECK_BROWSER='C:\Program Files\Google\Chrome\Application\chrome.exe'
          else
            export HOSTDECK_BROWSER='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          fi
          go test -count=1 -json -timeout=8m ./... | tee test-results/chrome/tests.jsonl
      - name: browser tests in Edge
        shell: bash
        env:
          HOSTDECK_ARTIFACT_DIR: ${{ github.workspace }}/test-results/edge
        run: |
          set -euo pipefail
          mkdir -p test-results/edge
          if [ "$RUNNER_OS" = Windows ]; then
            export HOSTDECK_BROWSER='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          else
            export HOSTDECK_BROWSER='/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge'
          fi
          go test -count=1 -json -timeout=8m ./e2e/ | tee test-results/edge/tests.jsonl
      - name: test timings and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the release archives without publishing them, and checks that each
  # carries the examples next to the program.
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: the archives carry the examples
        shell: bash
        run: |
          set -euo pipefail
          archives=(dist/*.tar.gz dist/*.zip)
          if [ "${#archives[@]}" -ne 4 ]; then echo "want 4 archives, got: ${archives[*]}"; exit 1; fi
          for a in "${archives[@]}"; do
            case "$a" in
              *.zip) list=$(unzip -Z1 "$a") ;;
              *) list=$(tar -tzf "$a") ;;
            esac
            for want in '/hostdeck(\.exe)?' /LICENSE /examples/disk/plugin.yaml /examples/disk/card.ps1 /examples/disk-history/plugin.yaml /examples/grafana/plugin.yaml; do
              grep -qE -- "^[^/]+$want\$" <<<"$list" || { echo "$a has no $want"; exit 1; }
            done
            if grep -q examples_test.go <<<"$list"; then echo "$a carries examples_test.go"; exit 1; fi
          done
