version: 2

project_name: hostdeck

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    # The program carries the examples for its plugins page; these copies are
    # there to read and adapt.
    files:
      - README.md
      - README.zh-CN.md
      - LICENSE
      - examples/*/*

checksum:
  name_template: checksums.txt

release:
  draft: true
