schema: 1
name: {en: Scheduled tasks, zh-CN: 定时任务}
icon: ⏱
description:
  en: Local script tasks configured in tasks.json. This first slice validates and displays configuration only; execution and automatic scheduling are not available yet. Installation and reads never run a script.
  zh-CN: 在 tasks.json 中配置本机脚本任务。当前切片只校验和展示配置，尚未提供执行和自动调度。安装和读取都不会运行脚本。
card:
  interval: 5s
  exec:
    command: ['@hostdeck', tasks, card]
detail:
  exec:
    command: ['@hostdeck', tasks, detail]
