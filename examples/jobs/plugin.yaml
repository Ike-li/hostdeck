schema: 1
name: {en: Background jobs, zh-CN: 后台任务}
description:
  en: How many of this user's loaded launchd jobs need attention, leaving out Apple's and ordinary applications, and a page that restarts a running job or runs one that is not. A running job is fine even if its last exit was not. Restart runs as the user the console runs as. On Windows, services whose program is outside the Windows directory. Works as it is.
  zh-CN: 当前用户已加载的 launchd 任务里，有几条需要处理；不含 Apple 自己的，也不含普通应用。详情页可以重启正在运行的，或运行没在运行的。正在运行的算正常，即使上次退出码不是 0。重启以控制台用户的权限执行。在 Windows 上，是程序不在 Windows 目录里的服务。不用改就能用。
card:
  exec:
    command: [sh, card.sh]
    windows: [powershell, -NoProfile, -NonInteractive, -ExecutionPolicy, Bypass, -File, card.ps1]
detail:
  exec:
    command: [sh, detail.sh]
    windows: [powershell, -NoProfile, -NonInteractive, -ExecutionPolicy, Bypass, -File, detail.ps1]
actions:
  exec:
    command: [sh, action.sh]
    windows: [powershell, -NoProfile, -NonInteractive, -ExecutionPolicy, Bypass, -File, action.ps1]
