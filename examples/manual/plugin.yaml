schema: 1
name: {en: Services started by hand, zh-CN: 手动启动的服务}
icon: 🖐️
description:
  en: TCP listeners started from a terminal or a session. The page shows the working directory and the command. Confirmed actions stop a process or restart it from this console. launchd jobs, Windows services and ports an app opens for itself are not listed. The console itself cannot be stopped here.
  zh-CN: 从终端或会话里启动、正在监听 TCP 的进程。页面显示工作目录和启动命令。确认后可以结束进程，或从本控制台重新启动。launchd 任务、Windows 服务和应用自己开的端口不在这里。本控制台自己不能在这里结束。
card:
  interval: 1m
  exec:
    command: ['@hostdeck', manual, card]
detail:
  exec:
    command: ['@hostdeck', manual, detail]
actions:
  exec:
    command: ['@hostdeck', manual, action]
